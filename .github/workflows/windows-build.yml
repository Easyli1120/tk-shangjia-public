name: Windows independent installer
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Save files in a draft release when Actions artifact storage is full
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install packaging compiler
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne 'f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b') { throw 'Compiler checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup-6.4.3'
          $setup = Start-Process $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=`"{0}`"" -f $compiler)) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "TKSHANGJIA_ISCC=$compiler\ISCC.exe" >> $env:GITHUB_ENV
      - name: Test and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Start-Transcript -Path release/build-log.txt
          try {
            Get-ChildItem fastmoss/tests/test_*.cjs | ForEach-Object {
              & node $_.FullName
              if ($LASTEXITCODE) { throw 'Frontend regression failed' }
            }
            ./fastmoss/packaging/build-windows.ps1
          } finally { Stop-Transcript }
      - name: Test installation and installed executable
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP '员工软件 TK clean install'
          Start-Transcript -Path release/install-test-log.txt
          $marker = Join-Path $env:LOCALAPPDATA 'TKShangjia/keep-on-uninstall.txt'
          New-Item -ItemType Directory -Force (Split-Path $marker) | Out-Null
          Set-Content $marker 'Keep employee data'
          $setup = Start-Process ./release/TKShangjia-Setup-2026.11.24-x64.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=`"{0}`"" -f $destination)) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw '安装失败' }
          & ./fastmoss/.venv-build/Scripts/python.exe ./fastmoss/packaging/smoke.py --executable "$destination/TKShangjia.exe"
          if ($LASTEXITCODE) { throw '安装后启动测试失败' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'TK 上架助手.lnk'
          if (-not (Test-Path $shortcut)) { throw '桌面快捷方式缺失' }
          $uninstall = Start-Process "$destination/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$destination/TKShangjia.exe")) { throw '卸载失败' }
          if (-not (Test-Path $marker)) { throw '卸载删除了用户数据' }
          Write-Output 'PASS: silent install, Unicode program path, desktop shortcut, installed runtime, uninstall, user data retained'
          Stop-Transcript
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.draft_release
        with:
          name: TKShangjia-Windows-x64
          path: |
            release/*.exe
            release/*.sha256
            release/*.json
            release/*.txt
          if-no-files-found: error
          retention-days: 30
      - name: Save tested installer to draft release
        if: success() && inputs.draft_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.sha256','.json','.txt' } | ForEach-Object { $_.FullName }
          & gh release create $tag @assets --draft --target $env:GITHUB_SHA --title 'TK 上架助手 2026.11.24 固定地址版' --notes-file fastmoss/packaging/employee-readme.txt
          if ($LASTEXITCODE) { throw '草稿安装包保存失败' }
